let state = {};

function weightedCountry() {
  const total = countries.reduce((s,c)=>s+c.w,0);
  let r = Math.random()*total;
  for(const c of countries){ if(r < c.w) return c; r-=c.w; }
  return countries[0];
}

function getName(gender, region) {
  const pool = namePools[region] || namePools.europa;
  const list = gender==="m" ? pool.m : pool.f;
  return list[Math.floor(Math.random()*list.length)];
}

function startLife() {
  const c = weightedCountry();
  const gender = Math.random()>0.5 ? "m" : "f";
  const name = getName(gender, c.region);

  state = {
    name, gender: gender==="m"?"hombre":"mujer",
    country: c.name, region: c.region,
    le: c.le, risk: c.risk, edu: c.edu,
    age:0, alive:true,
    education:"ninguna", job:"ninguno",
    married:false, children:0, divorced:false,
    emigrated:false, originalCountry: c.name,
    achievements:[], events:[],
    health:100
  };

  document.getElementById("start").classList.remove("active");
  document.getElementById("life").classList.add("active");
  addEvent(0, `Naciste en ${state.country} como ${state.gender}. Te llamaron ${state.name}.`);
  updateUI();
  setTimeout(runYear, 700);
}

function addEvent(age, text) {
  state.events.push({age,text});
  const log = document.getElementById("log");
  log.innerHTML += `<div class="event"><span class="age">${age} años</span><br>${text}</div>`;
  log.scrollTop = log.scrollHeight;
}

function updateUI() {
  document.getElementById("header").innerHTML = `<h1>${state.name}</h1><p class="subtitle">${state.country} · ${state.age} años</p>`;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><span>Educación</span>${state.education}</div>
    <div class="stat"><span>Trabajo</span>${state.job}</div>
    <div class="stat"><span>Estado civil</span>${state.married?"Casado/a":(state.divorced?"Divorciado/a":"Soltero/a")}</div>
    <div class="stat"><span>Hijos</span>${state.children}</div>
  `;
}

function runYear() {
  if(!state.alive) return;
  state.age++;

  // Muerte
  const deathChance = Math.pow(state.age / state.le, 2.8)*0.12 + state.risk*0.012;
  if(Math.random() < deathChance || state.age > state.le + 18){
    die(); return;
  }

    if(Math.random() < state.edu){
      state.education="primaria";
      addEvent(state.age,"Empezaste la escuela primaria.");
    } else {
      addEvent(state.age,"No pudiste ir a la escuela regularmente. Ayudabas en casa o trabajando.");
    }
  }

    addEvent(12,"Pasaste a la secundaria.");

    showChoice("Tienes la oportunidad de dejar los estudios para trabajar y ayudar a tu familia.",[
      {text:"Seguir estudiando", action:()=>addEvent(15,"Decidiste continuar estudiando a pesar de las dificultades económicas.")},
      {text:"Dejar la escuela", action:()=>{state.education=state.education==="secundaria"?"primaria":"ninguna"; state.job="trabajo familiar"; addEvent(15,"Dejaste la escuela para trabajar y apoyar a tu familia.");}}
    ]);
    return;
  }

  if(state.age===18){
    if(state.education==="secundaria" && Math.random()<state.edu*0.55){
      state.education="universidad";
      addEvent(18,"Entraste a la universidad. Fue un gran logro para tu familia.");
      state.achievements.push("Fue a la universidad");
    } else {
      state.job = jobs[Math.floor(Math.random()*jobs.length)];
      addEvent(18,`Empezaste a trabajar como ${state.job}.`);
    }
  }

  // Matrimonio
  if(state.age>=20 && state.age<=32 && !state.married && !state.divorced && Math.random()<0.18){
    state.married=true;
    addEvent(state.age,"Te casaste.");
  }

  // Divorcio
  if(state.married && state.age>28 && Math.random()<0.04){
    state.married=false; state.divorced=true;
    addEvent(state.age,"Tu matrimonio terminó en divorcio.");
  }

  // Hijos
  if(state.married && state.age>=20 && state.age<=40 && state.children<5 && Math.random()<0.22){
    state.children++;
    const n = state.children===1?"primer":state.children===2?"segundo":state.children===3?"tercer":"siguiente";
    addEvent(state.age,`Nació tu ${n} hijo/a.`);
  }

  // Cambio de trabajo
  if(state.age>22 && state.age%7===0 && Math.random()<0.35){
    const old = state.job;
    state.job = jobs[Math.floor(Math.random()*jobs.length)];
    if(state.job!==old) addEvent(state.age,`Cambiaste de trabajo. Ahora te dedicas a ${state.job}.`);
  }

  // Emigración
  if(state.age>=22 && state.age<=45 && !state.emigrated && Math.random()<0.07){
    showChoice("Surge una oportunidad de emigrar a otro país en busca de mejores condiciones.",[
      {text:"Emigrar", action:()=>{
        const dest = countries[Math.floor(Math.random()*Math.min(25,countries.length))];
        state.country = dest.name;
        state.emigrated = true;
        state.region = dest.region;
        state.le = Math.round((state.le + dest.le)/2);
        addEvent(state.age,`Emigraste a ${dest.name}. Empezaste una nueva etapa lejos de tu tierra natal.`);
        state.achievements.push("Emigró a otro país");
      }},
      {text:"Quedarte", action:()=>addEvent(state.age,"Decidiste quedarte en tu país a pesar de las dificultades.")}
    ]);
    return;
  }

  // Eventos aleatorios variados
  if(Math.random()<0.11){
    const evs = [
      "Sufriste una enfermedad grave pero lograste recuperarte.",
      "Perdiste a un ser querido muy cercano.",
      "Conseguiste un aumento o mejor puesto en el trabajo.",
      "Pasaste por una fuerte crisis económica familiar.",
      "Conociste a alguien que cambió tu perspectiva de la vida.",
      "Tuviste un accidente que te dejó secuelas temporales.",
      "Participaste en una protesta o movimiento social.",
      "Un familiar cercano emigró y te envió ayuda.",
      "Lograste comprar o construir algo propio (casa, terreno, negocio).",
      "Viviste un desastre natural que afectó tu zona.",
      "Recibiste una herencia pequeña pero significativa.",
      "Tuviste problemas con la autoridad o la policía.",
      "Encontraste un nuevo círculo de amigos que te apoyó mucho.",
      "Aprendiste una nueva habilidad que mejoró tus ingresos.",
      "Pasaste una temporada de soledad profunda.",
      "Celebraste un logro importante de uno de tus hijos.",
      "Te involucraste en tu comunidad o religión de forma activa.",
      "Sufriste discriminación o rechazo por tu origen o situación.",
      "Viajaste por primera vez fuera de tu región.",
      "Superaste una adicción o un mal hábito."
    ];
    addEvent(state.age, evs[Math.floor(Math.random()*evs.length)]);
  }

  // Logros
  if(state.age===50 && state.children>=2 && Math.random()<0.4){
    state.achievements.push("Criaste a varios hijos hasta la adultez");
  }
  if(state.age===60 && state.married){
    state.achievements.push("Llevaste un matrimonio de muchas décadas");
  }

  updateUI();
  setTimeout(runYear, 480 + Math.random()*350);
}

function showChoice(q, opts){
  const div = document.getElementById("choices");
  div.innerHTML = `<p style="margin-bottom:10px">${q}</p><div class="choice-btns"></div>`;
  const btns = div.querySelector(".choice-btns");
  opts.forEach(o=>{
    const b = document.createElement("button");
    b.className="btn secondary";
    b.textContent=o.text;
    b.onclick=()=>{ o.action(); div.innerHTML=""; updateUI(); setTimeout(runYear,700); };
    btns.appendChild(b);
  });
}

function die(){
  state.alive=false;
  const cause = deathCauses[Math.floor(Math.random()*deathCauses.length)];
  addEvent(state.age, `Moriste a los ${state.age} años por ${cause}.`);

  // Logros finales
  if(state.age>=80) state.achievements.push("Vivió una vida muy larga");
  if(state.emigrated) state.achievements.push("Construyó una vida en un país extranjero");
  if(state.education==="universidad") state.achievements.push("Fue universitario/a");
  if(state.children>=3) state.achievements.push("Tuvo una familia numerosa");

  setTimeout(()=>{
    document.getElementById("life").classList.remove("active");
    document.getElementById("end").classList.add("active");

    document.getElementById("end-title").textContent = `${state.name} (0 – ${state.age})`;

    let logros = state.achievements.length ? state.achievements.map(a=>`• ${a}`).join("<br>") : "• Una vida sencilla y silenciosa";

    document.getElementById("end-summary").innerHTML = `
      <p>Nació en <strong>${state.originalCountry}</strong>${state.emigrated?` y emigró a <strong>${state.country}</strong>`:""}.</p>
      <p style="margin-top:10px">Vivió ${state.age} años.<br>
      Educación: ${state.education}<br>
      Último trabajo: ${state.job}<br>
      ${state.married?"Estuvo casado/a":state.divorced?"Se divorció":"Permaneció soltero/a"}
      ${state.children>0?` · ${state.children} hijo${state.children>1?"s":""}`:""}.</p>
      <p style="margin-top:14px"><strong>Logros destacados:</strong><br>${logros}</p>
    `;

    document.getElementById("memorial").innerHTML = `
      Esta vida solo existió aquí, en esta simulación.<br>
      En el mundo real, millones de personas viven historias parecidas cada día, sin que nadie las recuerde.<br><br>
      Tú naciste donde naciste. Ellos tampoco eligieron.
    `;
  },1600);
}
</script>
